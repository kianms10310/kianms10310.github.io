<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f6">
  <meta name="description" content="2027년 6월 6일부터 16일까지 신혼여행 날짜별 일정">
  <title>신혼여행 · 2027.06.06–16</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="../jeju-2026/style.css">
  <style>.date-tabs{display:flex;overflow-x:auto;scrollbar-width:thin}.date-tab{flex:0 0 74px}</style>
  <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script defer src="./itinerary.js"></script>
  <script defer src="../jeju-2026/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="hero">
      <nav class="topnav"><a href="../" aria-label="여행 목록으로"><span aria-hidden="true">←</span> 여행 목록</a><span class="topnav-mark">ITINERARY <span aria-hidden="true">/</span> 02</span></nav>
      <div class="hero-main"><div class="eyebrow" id="location">HONEYMOON · 2027</div><h1 id="trip-title">신혼여행</h1><p id="trip-subtitle"></p><div class="hero-meta"><span class="date-range">06.06 <span aria-hidden="true">→</span> 06.16</span><span class="duration">11 DAYS</span></div></div>
    </header>
    <section class="overview" aria-live="polite"><div><span class="overline" id="overview-label">TODAY'S PLAN</span><h2 id="overview-title"></h2><p id="overview-description"></p></div><span class="overview-symbol" aria-hidden="true">✳</span></section>
    <nav class="date-nav" aria-label="날짜별 일정"><div class="date-tabs" id="date-tabs"></div></nav>
    <main>
      <section class="day-heading"><div><div class="overline" id="day-number"></div><h2 id="day-title"></h2><p id="day-summary"></p></div><div class="count" id="day-count"></div></section>
      <div class="progress-track" role="progressbar" aria-label="완료한 일정" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><span></span></div>
      <p class="save-note">완료·못함 기록은 현재 기기의 브라우저에 저장됩니다.</p>
      <section class="day-map-section" id="day-map-section" aria-label="선택한 날짜의 장소 지도" hidden>
        <div class="map-heading"><div><span class="overline">DAY MAP</span><h3>선택한 날짜의 위치</h3></div><span id="map-count"></span></div>
        <div id="day-map" aria-label="선택한 날짜의 장소 위치"></div>
        <ol class="map-places" id="map-places"></ol>
        <p class="map-note">후보 장소도 함께 표시합니다. 지도 핀은 위치 참고용이며, 정확한 길찾기는 구글 지도에서 확인하세요.</p>
      </section>
      <section id="carryovers" aria-label="이전 날짜에 못한 일정"></section>
      <section class="timeline" id="timeline" aria-label="선택한 날짜의 일정"></section>
      <p class="public-note">공개 일정 페이지이므로 예약번호와 개인 연락처는 표시하지 않습니다.</p>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
