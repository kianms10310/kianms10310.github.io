<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f6">
  <meta name="description" content="여행별 일정과 진행 상황을 확인하는 페이지">
  <title>여행 일정</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#192824;background:#f6f8f6;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}body{margin:0}main{max-width:760px;min-height:100vh;margin:auto;padding:clamp(28px,6vw,58px) 20px;background:#fff}.eyebrow{color:#178066;font-size:11px;font-weight:850;letter-spacing:.15em}h1{margin:12px 0 6px;font-size:clamp(38px,8vw,55px);font-weight:850;letter-spacing:-.065em;line-height:1.13}p{color:#7a8b80;line-height:1.6}.intro{margin:0;font-size:14px}.section-title{margin:50px 0 14px;color:#8d9c90;font-size:11px;font-weight:850;letter-spacing:.12em}.trip-list{display:grid;gap:12px}.card{display:block;padding:22px;border:1px solid #e5ece5;border-radius:17px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 4px 14px #1f3c2908;transition:transform .2s,border-color .2s}.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:#9dbaa7}.card:focus-visible{outline:3px solid #e2a457;outline-offset:2px}.card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}.card .tag,.card .status{display:inline-block;padding:5px 8px;border-radius:5px;background:#e7f2e9;color:#237b5c;font-size:10px;font-weight:900;letter-spacing:.04em}.card .status{background:#164e40;color:#fff;font-size:12px;font-variant-numeric:tabular-nums}.card .status.complete{background:#edf0ed;color:#66776b}.card h2{margin:16px 0 5px;font-size:23px;font-weight:850;letter-spacing:-.04em}.card p{margin:0;font-size:13px}.card .go{display:inline-block;margin-top:22px;color:#177c5e;font-size:13px;font-weight:800}footer{margin-top:42px;color:#9eaca2;font-size:11px}@media(max-width:420px){main{padding:32px 18px}.section-title{margin-top:44px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">TRAVEL PLANS</div>
    <h1>여행 일정</h1>
    <p class="intro">날짜별 계획과 진행 상황을 한눈에 확인하세요.</p>
    <div class="section-title">TRIPS</div>
    <div class="trip-list">
      <a class="card" href="./jeju-2026/" data-start="2026-11-12" data-end="2026-11-15">
        <div class="card-head"><span class="tag">2026.11.12 — 11.15</span><span class="status"></span></div>
        <h2>제주도 여행</h2>
        <p>1·2·4일차 일정 등록 · 3일차 미정</p>
        <span class="go">일정 보기 →</span>
      </a>
      <a class="card" href="./honeymoon-2027/" data-start="2027-06-06" data-end="2027-06-16">
        <div class="card-head"><span class="tag">2027.06.06 — 06.16</span><span class="status"></span></div>
        <h2>신혼여행</h2>
        <p>바르셀로나 · 마요르카 · 마드리드 · 8·9일차 미정</p>
        <span class="go">일정 보기 →</span>
      </a>
    </div>
    <footer>새 여행은 별도 폴더로 추가할 수 있습니다.</footer>
  </main>
  <script>
    (() => {
      const parts = new Intl.DateTimeFormat("en-US", {timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit"}).formatToParts(new Date());
      const value = type => parts.find(part => part.type === type).value;
      const today = `${value("year")}-${value("month")}-${value("day")}`;
      const dayNumber = date => Date.parse(`${date}T00:00:00Z`) / 86400000;
      document.querySelectorAll(".card[data-start]").forEach(card => {
        const {start, end} = card.dataset;
        const status = card.querySelector(".status");
        if (today > end) {
          status.textContent = "완료";
          status.classList.add("complete");
        } else if (today >= start) {
          status.textContent = "여행 중";
        } else {
          status.textContent = `D-${dayNumber(start) - dayNumber(today)}`;
        }
      });
    })();
  </script>
</body>
</html>
